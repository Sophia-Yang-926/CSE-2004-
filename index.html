<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Class Orientation Survey</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 36px 24px 64px;
      background-color: #f8f6f2;
      color: #454440;
      font-family: 'DM Sans', sans-serif;
      line-height: 1.7;
    }

    main {
      max-width: 860px;
      margin: 0 auto;
    }

    .washu-logo {
      display: block;
      width: auto;
      height: 36px;
      margin-bottom: 40px;
    }

    header {
      padding-bottom: 36px;
      margin-bottom: 40px;
      border-bottom: 1px solid #dedbd4;
      text-align: center;
    }

    h1 {
      margin: 0;
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 64px;
      font-weight: 500;
      line-height: 1.1;
      letter-spacing: -1px;
    }

    .intro {
      max-width: 590px;
      margin: 20px auto 0;
      color: #68665f;
      font-size: 16px;
    }

    figure {
      margin: 0;
    }

    .chart-container {
      position: relative;
      height: 390px;
    }

    @media (max-width: 600px) {
      body {
        padding: 28px 20px 40px;
      }

      .washu-logo {
        height: 30px;
        margin-bottom: 32px;
      }

      header {
        padding-bottom: 28px;
        margin-bottom: 28px;
      }

      h1 {
        font-size: 46px;
      }

      .intro {
        font-size: 14px;
      }

      .chart-container {
        height: 340px;
      }
    }
  </style>
</head>
<body>
  <main>
    <img class="washu-logo" src="https://washu.edu/app/uploads/2024/07/WashU-RGB_web.png" alt="WashU" width="149" height="36">
    <header>
      <h1>Class orientation survey</h1>
      <p class="intro">The survey shows the experience levels of 53 students in WashU's CSE 2004: Web Development class.</p>
    </header>

    <figure aria-label="What's your experience level with front-end web development?">
      <div class="chart-container">
        <canvas id="experienceChart" role="img" aria-label="Bar chart: Beginner, 30 students; Intermediate, 19 students; Advanced, 4 students.">
          Beginner: 30 students. Intermediate: 19 students. Advanced: 4 students.
        </canvas>
      </div>
    </figure>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script>
    const ctx = document.getElementById('experienceChart')

    Chart.defaults.font.family = "'DM Sans', sans-serif"
    Chart.defaults.color = '#68665f'

    new Chart(ctx, {
      type: 'bar',
      data: {
        labels: ['Beginner', 'Intermediate', 'Advanced'],
        datasets: [{
          label: 'Students',
          data: [30, 19, 4],
          backgroundColor: ['#9aaab1', '#a6af9c', '#b7a3a9'],
          borderRadius: 2,
          maxBarThickness: 110
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: {
            display: false
          }
        },
        scales: {
          y: {
            beginAtZero: true,
            suggestedMax: 35,
            title: {
              display: true,
              text: 'Number of students',
              color: '#454440',
              font: {
                size: 14,
                weight: 500
              },
              padding: 12
            },
            ticks: {
              stepSize: 5,
              padding: 8,
              font: {
                size: 12
              }
            },
            grid: {
              color: '#e4e1da'
            },
            border: {
              display: false
            }
          },
          x: {
            title: {
              display: true,
              text: 'Experience level',
              color: '#454440',
              font: {
                size: 14,
                weight: 500
              },
              padding: 12
            },
            ticks: {
              padding: 8,
              font: {
                size: 12
              }
            },
            grid: {
              display: false
            },
            border: {
              display: false
            }
          }
        }
      }
    })
  </script>
</body>
</html>
